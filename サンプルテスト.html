<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出版・エンタメ業界 筆記試験対策 100問ドリル (進捗保存機能付)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-wider text-cyan-400">マスコミ・出版業界対策：100問ドリル</h1>
                <p class="text-[11px] text-slate-400 mt-0.5">※ブラウザに進捗が自動保存されます</p>
            </div>
            
            <!-- Navigation Tabs -->
            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                <button id="tab-quiz" onclick="switchTab('quiz')" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-cyan-500 text-slate-950 shadow transition-all cursor-pointer">
                    クイズに挑戦
                </button>
                <button id="tab-list" onclick="switchTab('list')" class="px-4 py-1.5 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 transition-all cursor-pointer">
                    問題・回答一覧
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-2xl">
            
            <!-- Notification Toast for Save State -->
            <div id="toast-msg" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg z-50 animate-bounce">
                前回の進捗から再開しました！
            </div>

            <!-- ================= QUIZ MODE VIEW ================= -->
            <div id="quiz-view" class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-6 md:p-8 space-y-6 transition-all duration-300">
                <!-- Progress Bar & Reset -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center text-xs text-slate-400 font-mono">
                        <span id="progress-text">第 1 問 / 100問</span>
                        <div class="flex items-center gap-3">
                            <span id="category-badge" class="bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded-md font-medium">ジャンル</span>
                            <button onclick="confirmReset()" class="text-rose-400 hover:text-rose-300 underline cursor-pointer text-[11px]">進捗リセット</button>
                        </div>
                    </div>
                    <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-cyan-500 h-full transition-all duration-300" style="width: 1%"></div>
                    </div>
                </div>

                <!-- Question Screen -->
                <div id="question-screen" class="space-y-6">
                    <div class="bg-slate-850 p-5 rounded-xl border border-slate-750">
                        <p id="question-text" class="text-lg font-medium leading-relaxed text-slate-100">問題文がここに表示されます。</p>
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs text-slate-400 font-medium">脳内解答のメモ用（採点には影響しません）</label>
                        <input type="text" id="user-memo" placeholder="ここに解答を入力するか、頭の中で思い浮かべてください" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors">
                    </div>

                    <button id="show-answer-btn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-3.5 px-6 rounded-xl shadow-lg transition-all cursor-pointer">
                        正解と解説を表示する
                    </button>

                    <!-- Answer & Explanation Area -->
                    <div id="answer-area" class="hidden space-y-5 border-t border-slate-700 pt-5">
                        <div class="bg-emerald-950/40 border border-emerald-500/30 p-4 rounded-xl">
                            <span class="text-xs text-emerald-400 font-bold uppercase tracking-wider block mb-1">■ 正解</span>
                            <p id="correct-answer" class="text-xl font-bold text-emerald-400">正解データ</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-750 p-4 rounded-xl text-sm leading-relaxed text-slate-300">
                            <span class="text-xs text-cyan-400 font-bold uppercase tracking-wider block mb-1">■ 解説・背景</span>
                            <p id="explanation-text">解説データ</p>
                        </div>

                        <div class="space-y-2">
                            <p class="text-center text-xs text-slate-400">自分の解答は合っていましたか？</p>
                            <div class="grid grid-cols-2 gap-4">
                                <button onclick="submitScore(true)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 px-4 rounded-xl transition-colors cursor-pointer shadow-md">正解！</button>
                                <button onclick="submitScore(false)" class="bg-rose-600 hover:bg-rose-500 text-white font-medium py-3 px-4 rounded-xl transition-colors cursor-pointer shadow-md">間違えた...</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Result Screen -->
                <div id="result-screen" class="hidden text-center space-y-6 py-4">
                    <div class="space-y-2">
                        <h2 class="text-2xl font-bold text-cyan-400">全問終了！お疲れ様でした。</h2>
                    </div>
                    <div class="inline-block bg-slate-900 border border-slate-700 rounded-2xl p-6 px-10 shadow-inner">
                        <div class="text-sm text-slate-400">あなたの正解数</div>
                        <div class="text-5xl font-extrabold text-cyan-400 my-2 font-mono"><span id="final-score">0</span> <span class="text-2xl text-slate-500">/ 100</span></div>
                        <div class="text-xs text-slate-400">正解率: <span id="final-accuracy">0</span>%</div>
                    </div>
                    <div class="max-w-md mx-auto text-sm text-slate-300 bg-slate-850 p-4 rounded-xl border border-slate-750 leading-relaxed">
                        <p id="cheer-message">応援メッセージ</p>
                    </div>
                    <button onclick="restartQuiz()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2.5 px-6 rounded-xl transition-colors cursor-pointer text-sm">
                        データをクリアして最初から挑戦
                    </button>
                </div>
            </div>

            <!-- ================= LIST MODE VIEW ================= -->
            <div id="list-view" class="hidden space-y-4">
                <!-- Search & Filter Controls -->
                <div class="flex flex-col sm:flex-row gap-3 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                    <input type="text" id="search-input" oninput="filterList()" placeholder="キーワードで検索（例: 講談社、映画、フリーレン、インフレ...）" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors">
                    <select id="filter-category" onchange="filterList()" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 cursor-pointer">
                        <option value="all">すべてのジャンル</option>
                        <option value="出版・文学賞">出版・文学賞</option>
                        <option value="マンガ・アニメ業界">マンガ・アニメ業界</option>
                        <option value="芸能・音楽・映画">芸能・音楽・映画</option>
                        <option value="ファッション・メディアトレンド">ファッション・メディアトレンド</option>
                        <option value="世界情勢・一般時事">世界情勢・一般時事</option>
                    </select>
                </div>

                <!-- Match Count -->
                <div class="text-xs text-slate-400 font-mono pl-1">
                    該当件数: <span id="match-count" class="text-cyan-400 font-bold">100</span> / 100 問
                </div>

                <!-- Questions List Container -->
                <div id="list-container" class="space-y-4 max-h-[70vh] overflow-y-auto pr-2 custom-scrollbar">
                    <!-- Dynamic List Items Injection -->
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 py-3 text-center text-xs text-slate-500 border-t border-slate-850">
        &copy; 2026 出版・エンタメ業界総合試験対策 100問ドリル WebApp v3.
    </footer>

    <!-- Quiz Logic & Data JavaScript -->
    <script>
        // 100問のマスターデータ（他社動向・エンタメ全般に大幅に拡充）
        const quizData = [
            // --- 第1章：出版・文学賞（20問） ---

            {c:"出版・文学賞", q:"第174回芥川賞を『時の家』と同時にダブル受賞した、畠山丑雄の作品は？", a:"叫び", e:"幻と現実の二つの万博を貫く、封印されていた声を紡ぎ出した野心的な政治小説。"},

            {c:"出版・文学賞", q:"2026年本屋大賞で第2位となった、佐藤正午の過去の秘密が明かされる人間ドラマを描いた作品は？", a:"熟柿", e:"轢き逃げ、園児連れ去りといった罪を背負った女性とかかわる人々を描いた、岩波書店から刊行された長編。"},
            {c:"出版・文学賞", q:"2024年に『成瀬は天下を取りにいく』で本屋大賞を受賞し、滋賀県を舞台にしたエンタメ小説で旋風を巻き起こした新潮社刊行の著者は？", a:"宮島未奈", e:"地方を舞台にした作品のメガヒットは、出版業界における「地方書店活性化」の文脈でもよく語られます。"},

            {c:"出版・文学賞", q:"小学館が発行する、ミステリ、歴史、ノンフィクションなどエンタメ大衆小説を広く扱う月刊文芸誌の名称は？", a:"STORY BOX（ストーリーボックス / 旧・小説新潮など他社競合）", e:"各社、大衆文芸誌（小説すばる、小説新潮、オール讀物など）を持っており、賞レースの舞台になります。"},
            {c:"出版・文学賞", q:"出版ビジネスにおいて、出版社と書店の間に立ち、毎日の膨大な書籍・雑誌の物流と金銭決済を担う流通業者の総称は？", a:"出版取次（取次会社）", e:"日本出版販売（日販）やトーハンなどが大手。日本の独特な「全国どこでも同じ本が買える」仕組みを支える要。"},

            // --- 第2章：マンガ・アニメ業界（25問） ---

            {c:"世界情勢・一般時事", q:"2024年7月に20年ぶりに刷新された日本の新紙幣。1万円札の肖像に選ばれた、日本の資本主義の父と称される人物は誰か？", a:"渋沢栄一", e:"新紙幣の3名（渋沢栄一、津田梅子、北里柴三郎）は、教養・時事の基本として超重要。"},
            {c:"世界情勢・一般時事", q:"日本の少子化深刻度の基準となる、1人の女性が一生の間に生むとされる子どもの平均数を表す統計指標は？", a:"合計特殊出生率", e:"日本は過去最低水準の更新が続いており、労働力不足や社会保障制度の維持が国の最大課題。"},
            {c:"世界情勢・一般時事", q:"主要先進7カ国首脳会議（G7）のメンバーは、日本、アメリカ、イギリス、フランス、ドイツ、イタリアと、どこか？", a:"カナダ", e:"国際社会の政治・経済の諸課題を協議する枠組み。"},
            {c:"世界情勢・一般時事", q:"2026年夏に開催される、サッカーのワールドカップ（W杯）を共同開催する3カ国は、アメリカ、メキシコと、どこか？", a:"カナダ", e:"史上初めて48カ国が出場する大規模な大会であり、北米3カ国が舞台となります。"},
            {c:"世界情勢・一般時事", q:"モノの価格（物価）が継続的に上昇し、相対的にお金の価値が下がっていく経済現象を何というか？", a:"インフレ（インフレーション）", e:"資源高や円安を背景に、日本でも数十年のデフレ脱却から「インフレ社会」への移行と賃上げが叫ばれています。"},
            {c:"世界情勢・一般時事", q:"外国為替市場において、米ドルなどの主要通貨に対して日本円の価値が歴史的な水準まで下がっている現象を何というか？", a:"円安", e:"輸出企業の利益を押し上げる一方、エネルギーや原材料、食品などの輸入コストを高騰させ生活を直撃。"},
            {c:"世界情勢・一般時事", q:"日本の民法改正により、2022年4月から成人年齢は何歳に引き下げられたか？", a:"18歳", e:"若者の社会的・経済的自立を促す目的。親の同意なしでクレジットカードの契約などが可能になりました。"},
            {c:"世界情勢・一般時事", q:"近年の国連の推計において、地球全体の総人口は約何億人を突破したとされているか？", a:"80億人", e:"南アジアやアフリカを中心に人口爆発が続く一方、先進国では深刻な少子高齢化が進み、二極化しています。"},
            {c:"世界情勢・一般時事", q:"二酸化炭素をはじめとする温室効果ガスの排出量を、森林吸収などで相殺し、実質ゼロにすることを何というか？", a:"カーボンニュートラル（脱炭素）", e:"2050年までの達成を目指し、EVの普及や再生可能エネルギーへの転換が世界規模で義務化。"},
            {c:"世界情勢・一般時事", q:"デジタルトランスフォーメーション（DX）やAIの進化に伴い、社会人が新しい職業スキルを学び直すことを何というか？", a:"リスキリング", e:"国も巨額の予算を投じて支援しており、労働市場の流動化と生産性向上のためのキーワード。"},
            {c:"世界情勢・一般時事", q:"結婚後も、希望すれば夫婦がそれぞれの出生時の名字（姓）を法的に名乗れるようにする、日本で議論中の制度は？", a:"選択的夫婦別姓制度", e:"ジェンダー平等や個人の尊重を求める声が高まる一方、家族の一体感を重視する慎重論もあり対立。"},
            {c:"世界情勢・一般時事", q:"2024年に可決され、社会保障やパートタイム労働者の手取り額に直結する「〇〇万円の壁」の撤廃に向けた政府の税制・年金制度改革議論の対象金額は？", a:"106万円（または130万円）", e:"働き控えを防ぎ、深刻な人手不足を解消するための労働市場の最重要政策課題。"},
            {c:"世界情勢・一般時事", q:"生成AIによる文章や画像の大量生成が進む中、クリエイターの権利を守るために文化庁が2024年以降に発表・改定を続けている指針の名称は何か？", a:"AIと著作権に関する考え方（ガイドライン）", e:"AIの開発（学習）段階と、生成・利用段階での著作権侵害の線引きを示した、クリエイティブ業界最重要の法務トピック。"},
            {c:"世界情勢・一般時事", q:"近年、SNS上での誹謗中傷やデマ拡散を防止するため、発信者の情報開示手続きを簡素化・迅速化させた日本の法律の略称は何か？", a:"プロバイダ責任制限法（改正法、または情報流通プラットフォーム対処法）", e:"ネット上の個人の権利侵害を守るため、マスコミ各社も運用の動向を注視しています。"},
            {c:"世界情勢・一般時事", q:"大正15年（1926年）8月8日に創業され、2026年についに創業100周年の歴史的な節目を迎えた大手出版社は？", a:"集英社", e:"小学館の娯楽誌部門から独立してスタート。全出版社の中でも歴史の節目として象徴的な時事です。"}
        ];

        // ローカルストレージ用のキー
        const STORAGE_KEY_INDEX = "macc_quiz_index";
        const STORAGE_KEY_SCORE = "macc_quiz_score";

        let currentIndex = 0;
        let score = 0;

        // DOMの取得
        const progressText = document.getElementById("progress-text");
        const categoryBadge = document.getElementById("category-badge");
        const progressBar = document.getElementById("progress-bar");
        const questionText = document.getElementById("question-text");
        const userMemo = document.getElementById("user-memo");
        const showAnswerBtn = document.getElementById("show-answer-btn");
        const answerArea = document.getElementById("answer-area");
        const correctAnswer = document.getElementById("correct-answer");
        const explanationText = document.getElementById("explanation-text");
        const questionScreen = document.getElementById("question-screen");
        const resultScreen = document.getElementById("result-screen");
        const finalScore = document.getElementById("final-score");
        const finalAccuracy = document.getElementById("final-accuracy");
        const toastMsg = document.getElementById("toast-msg");

        // ローカルストレージから状態を復元
        function initQuiz() {
            const savedIndex = localStorage.getItem(STORAGE_KEY_INDEX);
            const savedScore = localStorage.getItem(STORAGE_KEY_SCORE);

            if (savedIndex !== null && savedScore !== null) {
                currentIndex = parseInt(savedIndex, 10);
                score = parseInt(savedScore, 10);
                
                // 1問目以降であれば再開トーストを表示
                if (currentIndex > 0 && currentIndex < quizData.length) {
                    toastMsg.classList.remove("hidden");
                    setTimeout(() => { toastMsg.classList.add("hidden"); }, 3000);
                }
            } else {
                currentIndex = 0;
                score = 0;
            }
            loadQuestion();
        }

        // 状態をローカルストレージに保存
        function saveProgress() {
            localStorage.setItem(STORAGE_KEY_INDEX, currentIndex);
            localStorage.setItem(STORAGE_KEY_SCORE, score);
        }

        // 手動進捗リセット
        function confirmReset() {
            if (confirm("これまでの進捗データを削除して、第1問からやり直しますか？")) {
                localStorage.removeItem(STORAGE_KEY_INDEX);
                localStorage.removeItem(STORAGE_KEY_SCORE);
                restartQuiz();
            }
        }

        // --- タブ切り替え制御 ---
        function switchTab(mode) {
            const quizView = document.getElementById("quiz-view");
            const listView = document.getElementById("list-view");
            const tabQuiz = document.getElementById("tab-quiz");
            const tabList = document.getElementById("tab-list");

            if (mode === "quiz") {
                quizView.classList.remove("hidden");
                listView.classList.add("hidden");
                tabQuiz.className = "px-4 py-1.5 rounded-lg text-sm font-bold bg-cyan-500 text-slate-950 shadow transition-all cursor-pointer";
                tabList.className = "px-4 py-1.5 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 transition-all cursor-pointer";
            } else {
                quizView.classList.add("hidden");
                listView.classList.remove("hidden");
                tabQuiz.className = "px-4 py-1.5 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 transition-all cursor-pointer";
                tabList.className = "px-4 py-1.5 rounded-lg text-sm font-bold bg-cyan-500 text-slate-950 shadow transition-all cursor-pointer";
                renderList(); 
            }
        }

        // --- クイズロジック ---
        function loadQuestion() {
            if (currentIndex < quizData.length) {
                questionScreen.classList.remove("hidden");
                resultScreen.classList.add("hidden");

                const currentQuiz = quizData[currentIndex];
                progressText.innerText = `第 ${currentIndex + 1} 問 / ${quizData.length}問`;
                categoryBadge.innerText = currentQuiz.c;
                progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
                questionText.innerText = currentQuiz.q;
                
                userMemo.value = "";
                answerArea.classList.add("hidden");
                showAnswerBtn.classList.remove("hidden");
            } else {
                showResult();
            }
        }

        showAnswerBtn.addEventListener("click", () => {
            const currentQuiz = quizData[currentIndex];
            correctAnswer.innerText = currentQuiz.a;
            explanationText.innerText = currentQuiz.e;
            showAnswerBtn.classList.add("hidden");
            answerArea.classList.remove("hidden");
        });

        function submitScore(isCorrect) {
            if (isCorrect) score++;
            currentIndex++;
            saveProgress(); // 進捗を保存
            loadQuestion();
        }

        function showResult() {
            questionScreen.classList.add("hidden");
            resultScreen.classList.remove("hidden");
            finalScore.innerText = score;
            const accuracy = Math.round((score / quizData.length) * 100);
            finalAccuracy.innerText = accuracy;
            
            const cheerMessage = document.getElementById("cheer-message");
            if (accuracy >= 80) {
                cheerMessage.innerText = "素晴らしい！マスコミ・出版社の筆記試験に十分通用するエンタメ一般教養が身についています。自信を持ってリラックスして本番に臨んでください！";
            } else if (accuracy >= 50) {
                cheerMessage.innerText = "合格ラインまであと一歩！間違えた他社ヒット作や著作権時事、新紙幣のキーワードを「一覧ページ」で復習し、直前まで知識を詰め込みましょう。伸び代は無限です！";
            } else {
                cheerMessage.innerText = "焦る必要はありません。出版の筆記試験は直前の詰め込みが最も効果を発揮します。一覧ページの検索機能を活用し、重要なエンタメ用語を繰り返し確認しましょう！";
            }
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            localStorage.removeItem(STORAGE_KEY_INDEX);
            localStorage.removeItem(STORAGE_KEY_SCORE);
            questionScreen.classList.remove("hidden");
            resultScreen.classList.add("hidden");
            loadQuestion();
        }

        // --- 一覧表示・検索フィルタロジック ---
        function renderList() {
            const listContainer = document.getElementById("list-container");
            const searchQuery = document.getElementById("search-input").value.toLowerCase();
            const selectedCategory = document.getElementById("filter-category").value;
            
            listContainer.innerHTML = "";
            let matchCount = 0;

            quizData.forEach((item, index) => {
                const matchesSearch = item.q.toLowerCase().includes(searchQuery) || 
                                      item.a.toLowerCase().includes(searchQuery) || 
                                      item.e.toLowerCase().includes(searchQuery);
                const matchesCategory = selectedCategory === "all" || item.c === selectedCategory;

                if (matchesSearch && matchesCategory) {
                    matchCount++;
                    const card = document.createElement("div");
                    card.className = "bg-slate-800 border border-slate-700/60 rounded-xl p-4 space-y-3 shadow-sm";
                    
                    // 現在挑戦中の問題に目印をつける
                    const isCurrent = index === currentIndex ? '<span class="text-[10px] bg-cyan-500 text-slate-950 font-bold px-1.5 py-0.5 rounded ml-2 animate-pulse">挑戦中</span>' : '';
                    const isPassed = index < currentIndex ? '<span class="text-[10px] bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded ml-2">解答済</span>' : '';

                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div class="flex items-center">
                                <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">Q.${index + 1}</span>
                                ${isCurrent}
                                ${isPassed}
                            </div>
                            <span class="text-xs bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded font-medium">${item.c}</span>
                        </div>
                        <p class="text-sm font-medium leading-relaxed text-slate-100">${item.q}</p>
                        <div class="bg-emerald-950/30 border border-emerald-500/20 p-3 rounded-lg">
                            <span class="text-[10px] text-emerald-400 font-bold block mb-0.5">【正解】</span>
                            <p class="text-sm font-bold text-emerald-400">${item.a}</p>
                        </div>
                        <div class="text-xs text-slate-300 bg-slate-900 border border-slate-750 p-3 rounded-lg leading-relaxed">
                            <span class="text-[10px] text-cyan-400 font-bold block mb-0.5">【解説・背景】</span>
                            ${item.e}
                        </div>
                    `;
                    listContainer.appendChild(card);
                }
            });

            document.getElementById("match-count").innerText = matchCount;
        }

        function filterList() {
            renderList();
        }

        // 初期化ロード
        initQuiz();
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</body>
</html>
